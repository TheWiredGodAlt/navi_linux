# ================================================================
# hyprlock.conf — Windows 11 lock screen style
# Blurred wallpaper, big white clock, centered acrylic input field
# ================================================================

general {
    hide_cursor = false
    ignore_empty_input = true
    grace = 0
}

# ==================================================================
# BACKGROUND — wallpaper with heavy frosted-glass blur, like Win11
# ==================================================================

background {
    monitor = HDMI-A-1
    path = ~/Wallpapers/spacemiku2.jpg
    # Dark tinted fallback, Win11 dark-mode vibe
    color = rgba(18, 18, 18, 0.75)

    # Strong acrylic blur
    blur_size = 6
    blur_passes = 3
    noise = 0.0
    contrast = 0.90
    brightness = 0.82
    vibrancy = 0.30
    vibrancy_darkness = 0.1
}

# ==================================================================
# CLOCK — big thin white time, centered upper half (Win11 style)
# ==================================================================

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"

    color = rgba(255, 255, 255, 0.95)

    font_size = 92
    # Segoe UI lookalike; falls back to JetBrainsMono if not installed
    font_family = Noto Sans Light

    position = 0, 260
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 0.25
}

# Date directly under the clock
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"

    color = rgba(255, 255, 255, 0.85)

    font_size = 20
    font_family = Noto Sans

    position = 0, 160
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.4)
    shadow_boost = 0.15
}

# Username label above the input field
label {
    monitor =
    text = $USER

    color = rgba(255, 255, 255, 0.9)

    font_size = 22
    font_family = Noto Sans

    position = 0, -60
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)
    shadow_boost = 0.15
}

# ==================================================================
# PASSWORD FIELD — translucent acrylic box, Win11 accent-blue outline
# ==================================================================

input-field {
    monitor =

    size = 320, 48
    position = 0, -140
    halign = center
    valign = center

    outline_thickness = 1
    rounding = 6
    rounding_power = 4.7

    # Win11 accent blue
    outer_color = rgba(0, 120, 212, 0.85)
    # Dark frosted inner, acrylic
    inner_color = rgba(30, 30, 30, 0.55)

    font_color = rgba(255, 255, 255, 0.95)
    font_family = Maple Mono

    placeholder_text = Password
    hide_input = false

    dots_center = true
    dots_size = 0.28
    dots_spacing = 0.2

    # State colors in Win11 tones
    check_color = rgba(16, 185, 129, 0.9)      # green check
    fail_color = rgba(244, 67, 54, 0.9)        # red failure
    fail_text = Incorrect password
    fail_timeout = 2000

    capslock_color = rgba(255, 179, 0, 0.9)
    numlock_color = rgba(16, 185, 129, 0.9)
    bothlock_color = rgba(0, 120, 212, 0.9)
}
